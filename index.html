<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DGSN Codes SQLite</title>
    <style>
        /* (نفس تنسيقات CSS السابقة مع تحسينات للموبايل) */
        body { font-family: sans-serif; background: #eceff1; margin: 0; padding: 10px; }
        .container { background: white; border-radius: 8px; padding: 15px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        input, button { width: 100%; padding: 12px; margin-bottom: 10px; border-radius: 5px; border: 1px solid #ccc; box-sizing: border-box; }
        button { background: #1a237e; color: white; font-weight: bold; border: none; }
        table { width: 100%; border-collapse: collapse; font-size: 14px; }
        th, td { border: 1px solid #ddd; padding: 8px; text-align: center; }
        th { background: #f5f5f5; }
        #main-app { display: none; }
    </style>
</head>
<body>

<!-- شاشة الدخول -->
<div id="login-screen" class="container" style="margin-top: 50px;">
    <h2 style="text-align: center;">تسجيل الدخول</h2>
    <input type="password" id="passwordField" placeholder="الرقم السري (dg25)">
    <button onclick="checkLogin()">دخول</button>
</div>

<!-- التطبيق الرئيسي -->
<div id="main-app" class="container">
    <h3>نظام الأكواد (SQLite)</h3>
    <input type="text" id="newId" placeholder="رقم الكود">
    <input type="text" id="newName" placeholder="البيان">
    <button onclick="saveToDB()" style="background: #2e7d32;">إضافة وحفظ في القاعدة</button>
    
    <input type="text" id="search" onkeyup="searchDB()" placeholder="بحث في القاعدة...">
    
    <table id="dataTable">
        <thead>
            <tr>
                <th>الكود</th>
                <th>البيان</th>
                <th>حذف</th>
            </tr>
        </thead>
        <tbody></tbody>
    </table>
</div>

<script>
    let db;

    // تشغيل الدخول
    function checkLogin() {
        if(document.getElementById('passwordField').value === "dg25") {
            document.getElementById('login-screen').style.display = "none";
            document.getElementById('main-app').style.display = "block";
            initDatabase();
        }
    }

    // إعداد قاعدة البيانات (WebSQL/SQLite المتاحة في المتصفحات والأندرويد)
    function initDatabase() {
        db = openDatabase('DGSN_DB', '1.0', 'Codes Database', 2 * 1024 * 1024);
        db.transaction(function (tx) {
            tx.executeSql('CREATE TABLE IF NOT EXISTS CODES (id UNIQUE, name)');
            loadFromDB();
        });
    }

    // حفظ بيانات جديدة
    function saveToDB() {
        let id = document.getElementById('newId').value;
        let name = document.getElementById('newName').value;
        if(id && name) {
            db.transaction(function (tx) {
                tx.executeSql('INSERT INTO CODES (id, name) VALUES (?, ?)', [id, name]);
                loadFromDB();
            });
            document.getElementById('newId').value = "";
            document.getElementById('newName').value = "";
        }
    }

    // عرض البيانات من SQLite
    function loadFromDB() {
        db.transaction(function (tx) {
            tx.executeSql('SELECT * FROM CODES', [], function (tx, results) {
                let tbody = document.querySelector("#dataTable tbody");
                tbody.innerHTML = "";
                for (let i = 0; i < results.rows.length; i++) {
                    let item = results.rows.item(i);
                    tbody.innerHTML += `<tr>
                        <td>${item.id}</td>
                        <td>${item.name}</td>
                        <td><button onclick="deleteFromDB('${item.id}')" style="background:red; padding:2px;">X</button></td>
                    </tr>`;
                }
            });
        });
    }

    function deleteFromDB(id) {
        db.transaction(function (tx) {
            tx.executeSql('DELETE FROM CODES WHERE id=?', [id]);
            loadFromDB();
        });
    }

    function searchDB() {
        let val = document.getElementById('search').value;
        db.transaction(function (tx) {
            tx.executeSql("SELECT * FROM CODES WHERE name LIKE ? OR id LIKE ?", ['%'+val+'%', '%'+val+'%'], function (tx, results) {
                let tbody = document.querySelector("#dataTable tbody");
                tbody.innerHTML = "";
                for (let i = 0; i < results.rows.length; i++) {
                    let item = results.rows.item(i);
                    tbody.innerHTML += `<tr><td>${item.id}</td><td>${item.name}</td><td>...</td></tr>`;
                }
            });
        });
    }
</script>
</body>
</html>
